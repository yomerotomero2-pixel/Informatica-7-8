<!DOCTYPE html>
<html lang="en">
    <head>
        <title>
            Muisc Box
        </title>
        <script src="script.js"></script>
        <link href="style.css" rel="stylesheet">

    <body>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&display=swap" rel="stylesheet">
    </head>
        <h1>Music Box</h1>
        <br>
        <br>
        <br>
        <br>
        <br>
        <br>
        <br>
        <div class="flex1">
            <div id="kick" class="instrument">
                <h2>A</h2>
                <p>Kick</p>
            </div>

            <div id="snare" class="instrument">
                <h2>S</h2>
                <p>Snare</p>
            </div>

            <div id="clap" class="instrument">
                <h2>C</h2>
                <p>Clap</p>
            </div>
        </div>

        <div class="flex2">
            <div id="cowbell" class="instrument">
                <h2>O</h2>
                <p>Cowbell</p>
            </div>

            <div id="hihat" class="instrument">
                <h2>H</h2>
                <p>Hihat</p>
            </div>

            <div id="openhat" class="instrument">
                <h2>P</h2>
                <p>Openhat</p>
            </div>
        </div>

        <div class="flex3">
            <div id="tom" class="instrument">
                <h2>T</h2>
                <p>Tom</p>
            </div>

            <div id="yuh" class="instrument">
                <h2>Y</h2>
                <p>Yuh</p>
            </div>
        </div>

    </body>
